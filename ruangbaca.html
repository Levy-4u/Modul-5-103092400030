<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengenalan Bootstrap</title>

  <!--
    =====================================================================
    IMPORT BOOTSTRAP via CDN (Content Delivery Network)
    Tidak perlu download, cukup koneksi internet saat buka halaman ini.

    Bootstrap 5.3.0 → CSS (tampilan/style)
    =====================================================================
  -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous"
  />

  <!--
    Google Fonts — Satu typeface tebal untuk heading, satu clean untuk body.
    Tidak wajib, tapi membuat teks lebih enak dibaca.
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    /*
      ===================================================================
      CSS KUSTOM — Ini berjalan "di atas" Bootstrap.
      Bootstrap memberi dasar, CSS kita memodifikasi seperlunya.
      ===================================================================
    */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fb;
      color: #1e1e2e;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Sora', sans-serif;
    }

    /* Navbar kustom agar sedikit lebih gelap dari default Bootstrap */
    .navbar-brand span {
      color: #6ea8fe; /* biru muda — aksen utama */
    }

    /* Section header — garis bawah tipis sebagai penanda topik */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      border-left: 4px solid #6ea8fe;
      padding-left: 0.75rem;
      margin-bottom: 1.25rem;
      color: #1e1e2e;
    }

    /* Card kustom dengan shadow halus */
    .demo-card {
      background: #ffffff;
      border: 1px solid #e2e5ef;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Kode inline — biar kelihatan seperti syntax highlight sederhana */
    code {
      background: #eef1ff;
      color: #3b5bdb;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.88em;
    }

    /* Label penjelasan di samping demo */
    .label-ket {
      font-size: 0.78rem;
      color: #6c757d;
      margin-top: 0.25rem;
    }

    footer {
      background: #1e1e2e;
      color: #adb5bd;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        Ruang <span>Baca</span>
      </a>

      <!-- Tombol hamburger muncul saat layar kecil (< md / < 768px) -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menuNav"
        aria-controls="menuNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Konten navbar yang collapse di layar kecil -->
      <div class="collapse navbar-collapse" id="menuNav">
        <ul class="navbar-nav ms-auto">
          <!-- ms-auto = margin-start: auto → mendorong menu ke kanan (CSS: margin-left: auto) -->
          <li class="nav-item"><a class="nav-link active" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bantuan</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">

  <main class="container-fluid bg-light mx-2 mb-4" style="width: calc(100% - 1rem); min-height: 450px;">
    <div class="row justify-content-center py-5">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4" style="max-width: 360px;">
        <div class="card border-0 shadow rounded-3 overflow-hidden">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <h3 class="h4 fw-semibold mb-2">Masuk ke Ruang Baca</h3>
              <p class="text-secondary small mb-0">Temukan bacaan untuk hari ini.</p>
            </div>
            <form action="#" method="post">
              <div class="mb-3">
                <label for="username" class="form-label small mb-1">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label small mb-1">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" value="1" id="remember">
                <label class="form-check-label small" for="remember">Ingat saya</label>
              </div>
              <button type="submit" class="btn btn-success w-100">Masuk</button>
            </form>
          </div>
          <div class="card-footer bg-light text-center py-3">
            <a href="#" class="link-success small">Lupa password?</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
